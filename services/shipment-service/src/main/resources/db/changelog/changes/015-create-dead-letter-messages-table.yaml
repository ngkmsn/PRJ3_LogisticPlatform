databaseChangeLog:
  - changeSet:
      id: 015-create-dead-letter-messages-table
      author: logistics-team
      changes:
        - createTable:
            tableName: dead_letter_messages
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: original_message_id
                  type: VARCHAR(100)
              - column:
                  name: original_topic
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: original_partition
                  type: INT
              - column:
                  name: original_offset
                  type: BIGINT
              - column:
                  name: event_type
                  type: VARCHAR(100)
              - column:
                  name: aggregate_id
                  type: VARCHAR(100)
              - column:
                  name: payload
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: exception_class
                  type: VARCHAR(255)
              - column:
                  name: error_message
                  type: VARCHAR(1000)
              - column:
                  name: retry_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: PENDING_INSPECTION
                  constraints:
                    nullable: false
              - column:
                  name: failed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: replayed_at
                  type: TIMESTAMP
              - column:
                  name: replayed_by
                  type: VARCHAR(100)

        - createIndex:
            indexName: idx_dlq_status
            tableName: dead_letter_messages
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_dlq_original_topic
            tableName: dead_letter_messages
            columns:
              - column:
                  name: original_topic

        - createIndex:
            indexName: idx_dlq_original_message_id
            tableName: dead_letter_messages
            columns:
              - column:
                  name: original_message_id

        - createIndex:
            indexName: idx_dlq_failed_at
            tableName: dead_letter_messages
            columns:
              - column:
                  name: failed_at
