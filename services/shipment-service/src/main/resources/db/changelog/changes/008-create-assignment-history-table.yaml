databaseChangeLog:
  - changeSet:
      id: 008-create-assignment-history-table
      author: logistics-team
      changes:
        - createTable:
            tableName: assignment_history
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: assignment_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: previous_driver_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: new_driver_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: action_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: performed_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_assignment_history_order_id
            tableName: assignment_history
            columns:
              - column:
                  name: order_id
        - createIndex:
            indexName: idx_assignment_history_assignment_id
            tableName: assignment_history
            columns:
              - column:
                  name: assignment_id
        - createIndex:
            indexName: idx_assignment_history_created_at
            tableName: assignment_history
            columns:
              - column:
                  name: created_at
