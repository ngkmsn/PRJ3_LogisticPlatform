databaseChangeLog:
  - changeSet:
      id: 007-add-reassign-fields-to-assignments
      author: logistics-team
      changes:
        - addColumn:
            tableName: assignments
            columns:
              - column:
                  name: previous_driver_id
                  type: VARCHAR(100)
              - column:
                  name: reassign_reason
                  type: VARCHAR(255)
              - column:
                  name: reassigned_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: reassigned_by
                  type: VARCHAR(100)
