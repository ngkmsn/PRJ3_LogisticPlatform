databaseChangeLog:
  - changeSet:
      id: 002-create-assignments-table
      author: logistics-team
      changes:
        - createTable:
            tableName: assignments
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: order_number
                  type: VARCHAR(50)
              - column:
                  name: customer_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: recipient_name
                  type: VARCHAR(100)
              - column:
                  name: recipient_phone
                  type: VARCHAR(20)
              - column:
                  name: delivery_address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: NUMERIC(12, 2)
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: driver_id
                  type: VARCHAR(100)
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - createIndex:
            indexName: idx_assignments_order_id
            tableName: assignments
            columns:
              - column:
                  name: order_id
        - createIndex:
            indexName: idx_assignments_status
            tableName: assignments
            columns:
              - column:
                  name: status
