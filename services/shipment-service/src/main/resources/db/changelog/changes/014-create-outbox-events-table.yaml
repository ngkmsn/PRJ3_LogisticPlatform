databaseChangeLog:
  - changeSet:
      id: 014-create-outbox-events-table
      author: logistics-team
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: aggregate_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: retry_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: VARCHAR(500)
              - column:
                  name: occurred_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_shipment_outbox_events_status
            tableName: outbox_events
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_shipment_outbox_events_aggregate_id
            tableName: outbox_events
            columns:
              - column:
                  name: aggregate_id

        - createIndex:
            indexName: idx_shipment_outbox_events_occurred_at
            tableName: outbox_events
            columns:
              - column:
                  name: occurred_at
