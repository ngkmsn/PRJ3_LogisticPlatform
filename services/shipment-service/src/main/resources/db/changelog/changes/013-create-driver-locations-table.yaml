databaseChangeLog:
  - changeSet:
      id: 013-create-driver-locations-table
      author: logistics-team
      changes:
        - createTable:
            tableName: driver_locations
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: driver_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: latitude
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: longitude
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: accuracy
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: true
              - column:
                  name: speed
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: true
              - column:
                  name: bearing
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: true
              - column:
                  name: order_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: timestamp
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_driver_locations_driver_id
            tableName: driver_locations
            columns:
              - column:
                  name: driver_id
        - createIndex:
            indexName: idx_driver_locations_timestamp
            tableName: driver_locations
            columns:
              - column:
                  name: timestamp
