spring:
  application:
    name: shipment-service

server:
  port: ${SHIPMENT_SERVICE_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    description: "Tracks shipments, vehicles, routes, and real-time location updates"
