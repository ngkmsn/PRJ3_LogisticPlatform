quarkus.application.name=shipment-service
quarkus.http.port=${SHIPMENT_SERVICE_PORT:8083}

# Datasource - PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shipment_db}}
quarkus.datasource.username=${DB_USERNAME:shipment_service_user}
quarkus.datasource.password=${DB_PASSWORD:shipment_password}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

# Hibernate
quarkus.hibernate-orm.database.generation=none

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# SmallRye Reactive Messaging - Incoming Order Events Channel
mp.messaging.incoming.order-events.connector=smallrye-kafka
mp.messaging.incoming.order-events.topic=logistics.order.events
mp.messaging.incoming.order-events.group.id=shipment-assignment-group
mp.messaging.incoming.order-events.auto.offset.reset=earliest
mp.messaging.incoming.order-events.enable.auto.commit=false
mp.messaging.incoming.order-events.failure-strategy=fail

# SmallRye Reactive Messaging - Outgoing Shipment Events Channel (PB-032)
mp.messaging.outgoing.shipment-events.connector=smallrye-kafka
mp.messaging.outgoing.shipment-events.topic=logistics.shipment.events
mp.messaging.outgoing.shipment-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.shipment-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# Disable Quarkus Dev Services (Docker not running locally)
quarkus.devservices.enabled=false

# Workload Evaluation Configuration (PB-028)
logistics.assignment.driver.workload.hard-limit=3
logistics.assignment.driver.workload.soft-limit=2
logistics.assignment.driver.workload.soft-limit-penalty=30.0
logistics.assignment.driver.workload.hard-limit-penalty=60.0
logistics.assignment.driver.workload.idle-bonus=20.0
logistics.assignment.driver.workload.reject-at-hard-limit=false

# Proximity Evaluation Configuration (PB-029)
logistics.assignment.driver.location.max-age-minutes=30

# Driver Selection & Composite Ranking Scoring (PB-030)
logistics.assignment.scoring.distance-penalty-per-km=2.0
logistics.assignment.scoring.stale-location-penalty=15.0
logistics.assignment.scoring.missing-location-penalty=50.0

# Map Service Integration Configuration (PB-047)
logistics.map.provider.type=${MAP_PROVIDER_TYPE:MOCK}
logistics.map.service.url=${MAP_SERVICE_URL:http://localhost:5000}
logistics.map.timeout-ms=${MAP_TIMEOUT_MS:3000}
logistics.map.fallback.enabled=${MAP_FALLBACK_ENABLED:true}
logistics.map.rate-limit.permits-per-second=${MAP_RATE_LIMIT_PERMITS_PER_SECOND:50}

# Operations Dashboard Aggregator Configuration (PB-048)
logistics.order.service.url=${ORDER_SERVICE_URL:http://localhost:8082}
logistics.user.service.url=${USER_SERVICE_URL:http://localhost:8081}
logistics.dashboard.cache.ttl-seconds=${DASHBOARD_CACHE_TTL_SECONDS:15}

# Test Profile
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:shipment_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.liquibase.migrate-at-start=true
%test.quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
%test.quarkus.http.test-port=0
%test.mp.messaging.incoming.order-events.connector=smallrye-in-memory
%test.mp.messaging.outgoing.shipment-events.connector=smallrye-in-memory
