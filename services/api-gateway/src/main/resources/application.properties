quarkus.application.name=api-gateway
quarkus.http.port=${GATEWAY_PORT:8080}

# Backend service target URLs
gateway.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
gateway.order-service.url=${ORDER_SERVICE_URL:http://localhost:8082}
gateway.shipment-service.url=${SHIPMENT_SERVICE_URL:http://localhost:8083}
gateway.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}

# Test configuration
%test.quarkus.http.test-port=0
