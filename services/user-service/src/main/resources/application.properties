# Application Configuration
quarkus.application.name=user-service
quarkus.http.port=${USER_SERVICE_PORT:8081}

# PostgreSQL Datasource (Production / Development)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
quarkus.datasource.username=${DB_USERNAME:user_service_user}
quarkus.datasource.password=${DB_PASSWORD:user_password}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2

# Hibernate ORM
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# Liquibase Database Migrations
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

# JWT Configuration (PB-009)
security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
security.jwt.issuer=${JWT_ISSUER:logistics-platform}

# Health Checks
quarkus.smallrye-health.root-path=/q/health

# ==============================================================================
# Test Profile (%test) - Uses in-memory H2 database
# ==============================================================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:user_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=validate
%test.quarkus.liquibase.migrate-at-start=true
%test.quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
%test.quarkus.http.test-port=0
