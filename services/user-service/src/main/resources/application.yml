spring:
  application:
    name: user-service

server:
  port: ${USER_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    description: "Manages users, roles, and authentication identity"
