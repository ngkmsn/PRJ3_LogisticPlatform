databaseChangeLog:
  - changeSet:
      id: 002-add-auth-columns
      author: logistics-team
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
