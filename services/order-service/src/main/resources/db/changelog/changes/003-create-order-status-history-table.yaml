databaseChangeLog:
  - changeSet:
      id: 003-create-order-status-history-table
      author: logistics-team
      changes:
        - createTable:
            tableName: order_status_history
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_status_history_order_id
                    references: orders(id)
                    deleteCascade: true
              - column:
                  name: order_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: previous_status
                  type: VARCHAR(30)
              - column:
                  name: new_status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: changed_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: changed_by_role
                  type: VARCHAR(50)
              - column:
                  name: reason
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_order_status_history_order_id
            tableName: order_status_history
            columns:
              - column:
                  name: order_id

        - createIndex:
            indexName: idx_order_status_history_created_at
            tableName: order_status_history
            columns:
              - column:
                  name: created_at
