spring:
  application:
    name: order-service

server:
  port: ${ORDER_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    description: "Manages the lifecycle of logistics orders"
