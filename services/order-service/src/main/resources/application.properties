quarkus.application.name=order-service
quarkus.http.port=${ORDER_SERVICE_PORT:8082}

# Datasource - PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}}
quarkus.datasource.username=${DB_USERNAME:order_service_user}
quarkus.datasource.password=${DB_PASSWORD:order_password}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

# Hibernate
quarkus.hibernate-orm.database.generation=none

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Disable Quarkus Dev Services (Docker not running locally)
quarkus.devservices.enabled=false

# Test Profile
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:order_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.liquibase.migrate-at-start=true
%test.quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
%test.quarkus.http.test-port=0
