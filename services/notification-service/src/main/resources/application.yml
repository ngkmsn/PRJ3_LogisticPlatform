spring:
  application:
    name: notification-service

server:
  port: ${NOTIFICATION_SERVICE_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    description: "Sends outbound notifications triggered by platform events"
