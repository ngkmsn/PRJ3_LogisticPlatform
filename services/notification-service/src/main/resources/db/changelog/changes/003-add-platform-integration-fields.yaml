databaseChangeLog:
  - changeSet:
      id: 003-add-platform-integration-fields
      author: logistics-team
      changes:
        - addColumn:
            tableName: notifications
            columns:
              - column:
                  name: platform_notification_id
                  type: VARCHAR(100)
              - column:
                  name: priority
                  type: VARCHAR(20)
              - column:
                  name: error_message
                  type: VARCHAR(500)
              - column:
                  name: retry_count
                  type: INT
                  defaultValueNumeric: 0

        - createIndex:
            indexName: idx_notifications_platform_id
            tableName: notifications
            columns:
              - column:
                  name: platform_notification_id
