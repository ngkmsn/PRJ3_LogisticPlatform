databaseChangeLog:
  - changeSet:
      id: 002-add-notification-details-and-inbox
      author: logistics-team
      changes:
        - addColumn:
            tableName: notifications
            columns:
              - column:
                  name: event_id
                  type: VARCHAR(100)
              - column:
                  name: event_type
                  type: VARCHAR(100)
              - column:
                  name: order_id
                  type: VARCHAR(100)
              - column:
                  name: subject
                  type: VARCHAR(255)
              - column:
                  name: content
                  type: VARCHAR(1000)
              - column:
                  name: sent_at
                  type: TIMESTAMP

        - createIndex:
            indexName: idx_notifications_event_id
            tableName: notifications
            columns:
              - column:
                  name: event_id

        - createIndex:
            indexName: idx_notifications_order_id
            tableName: notifications
            columns:
              - column:
                  name: order_id

        - createTable:
            tableName: inbox_events
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_notification_inbox_events_event_id
            tableName: inbox_events
            columns:
              - column:
                  name: event_id
