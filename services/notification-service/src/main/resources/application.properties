quarkus.application.name=notification-service
quarkus.http.port=${NOTIFICATION_SERVICE_PORT:8084}

# Datasource - PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}}
quarkus.datasource.username=${DB_USERNAME:notification_service_user}
quarkus.datasource.password=${DB_PASSWORD:notification_password}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

# Hibernate
quarkus.hibernate-orm.database.generation=none

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Incoming Channel
mp.messaging.incoming.shipment-events.connector=smallrye-kafka
mp.messaging.incoming.shipment-events.topic=logistics.shipment.events
mp.messaging.incoming.shipment-events.auto.offset.reset=earliest
mp.messaging.incoming.shipment-events.group.id=notification-service-group
mp.messaging.incoming.shipment-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.shipment-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Mailer (Mailpit / SMTP)
quarkus.mailer.from=notifications@logistics.com
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.mock=false

# Notification Platform Integration
notification.platform.url=${NOTIFICATION_PLATFORM_URL:http://localhost:8085}
notification.platform.endpoint=${NOTIFICATION_PLATFORM_ENDPOINT:/api/v1/notifications}
notification.platform.api-key=${NOTIFICATION_PLATFORM_API_KEY:}
notification.platform.auth-token=${NOTIFICATION_PLATFORM_AUTH_TOKEN:}
notification.platform.connect-timeout-seconds=${NOTIFICATION_PLATFORM_CONNECT_TIMEOUT_SECONDS:3}
notification.platform.request-timeout-seconds=${NOTIFICATION_PLATFORM_REQUEST_TIMEOUT_SECONDS:5}
notification.platform.max-retries=${NOTIFICATION_PLATFORM_MAX_RETRIES:3}
notification.platform.retry-delay-ms=${NOTIFICATION_PLATFORM_RETRY_DELAY_MS:500}

# Notification Retry Worker
notification.retry.enabled=${NOTIFICATION_RETRY_ENABLED:true}
notification.retry.interval=${NOTIFICATION_RETRY_INTERVAL:10s}
notification.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS:5}
notification.retry.batch-size=${NOTIFICATION_RETRY_BATCH_SIZE:20}

# Disable Quarkus Dev Services (Docker not running locally)
quarkus.devservices.enabled=false

# Test Profile
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:notification_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.liquibase.migrate-at-start=true
%test.quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
%test.quarkus.mailer.mock=true
%test.quarkus.http.test-port=0
%test.mp.messaging.incoming.shipment-events.connector=smallrye-in-memory
%test.notification.retry.enabled=false
%test.notification.platform.max-retries=2
%test.notification.platform.retry-delay-ms=50
